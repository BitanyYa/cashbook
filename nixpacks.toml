[providers]
providers = ["php", "node"]

[phases.setup]
nixPkgs = ["php82", "composer", "php82Extensions.gd", "php82Extensions.zip", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.bcmath", "php82Extensions.fileinfo", "nodejs_20"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction", "npm ci || npm install"]

[phases.build]
cmds = ["npm run build"]
